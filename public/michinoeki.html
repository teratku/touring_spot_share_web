<style>
  /*
   * 道の駅マップ（利用者の要望 2026-10-30:「道の駅マップみたいなものがあるとわかりやすい」→「webも同じようにしたい」）。
   * アプリの MichiNoEkiMapView と同じく、訪問済み=緑・まだ=灰色の点、すべて/訪問済み/まだ、都道府県ごとの n/全数。
   * ⚠️ 訪問はアプリの端末の中にある。Web はクラウドのバックアップ（micinoEkiBackUp/{uid}）を読む。
   *    アプリの実績 › 道の駅「Webの道の駅マップにも出す」をオンにした人は、訪問が増えるたびに書かれる
   * ⚠️ ログインしていなくても一覧（全駅・灰色）は見られる
   */
  .me-main { max-width: 1120px; }
  .me-summary { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
  .me-count { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .me-count b { font-size: 32px; line-height: 1; color: var(--ts-green); }
  .me-count span { font-size: 15px; color: var(--ts-text-2); }
  .me-bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--ts-surface-2); overflow: hidden; }
  .me-bar > i { display: block; height: 100%; background: var(--ts-gradient); border-radius: inherit; min-width: 4px; }
  .me-note { grid-column: 1 / -1; font-size: 13px; color: var(--ts-text-2); line-height: 1.6; margin: 0; }
  .me-note a { font-weight: 600; }
  .me-seg { display: inline-flex; background: var(--ts-surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .me-seg button { border: none; background: transparent; color: var(--ts-text); font: 600 13px/1.2 var(--ts-font);
                   padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  .me-seg button[aria-pressed="true"] { background: var(--ts-surface); box-shadow: 0 1px 3px rgba(16, 24, 32, .15); }
  .me-seg button:focus-visible, .me-pref:focus-visible, .me-recent button:focus-visible { outline: 3px solid var(--ts-teal); outline-offset: 2px; }

  .me-layout { display: grid; grid-template-columns: 1fr 300px; gap: 12px; margin-top: 12px; align-items: start; }
  .me-mapwrap { position: relative; border-radius: var(--ts-radius); overflow: hidden; box-shadow: var(--ts-shadow); background: var(--ts-surface-2); }
  #map { height: min(72vh, 680px); min-height: 360px; }
  .me-legend { position: absolute; top: 10px; left: 10px; display: flex; gap: 10px; align-items: center;
               background: var(--ts-surface); color: var(--ts-text); border-radius: 999px; padding: 5px 12px;
               font-size: 12px; box-shadow: var(--ts-shadow); }
  .me-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; border: 1.5px solid #fff; }
  .me-dot--v { background: var(--ts-green); }
  .me-dot--u { background: #8E8E93; width: 8px; height: 8px; }
  .me-card { position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--ts-surface); color: var(--ts-text);
             border-radius: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .2); padding: 14px 44px 14px 16px; }
  .me-card[hidden] { display: none; }
  .me-card h3 { margin: 0; font-size: 17px; }
  .me-card .pref { font-size: 12px; color: var(--ts-text-2); margin-top: 2px; }
  .me-card .visits { font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .me-card .visits.v { color: var(--ts-green); font-weight: 600; }
  .me-card .visits.u { color: var(--ts-text-2); }
  .me-card .first { font-size: 12px; color: var(--ts-text-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .me-card .links { margin-top: 8px; font-size: 13px; }
  .me-close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: none;
              background: var(--ts-surface-2); color: var(--ts-text-2); font-size: 16px; cursor: pointer; }

  .me-side { display: flex; flex-direction: column; gap: 12px; }
  .me-side h2 { font-size: 13px; letter-spacing: .04em; color: var(--ts-text-2); margin: 0 0 8px; font-weight: 700; }
  .me-prefs { list-style: none; margin: 0; padding: 0; max-height: min(60vh, 520px); overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  .me-pref { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; text-align: left;
             border: none; background: transparent; color: var(--ts-text); padding: 7px 8px; border-radius: 8px;
             font: 14px/1.3 var(--ts-font); cursor: pointer; }
  .me-pref:hover { background: var(--ts-surface-2); }
  .me-pref[aria-pressed="true"] { background: rgba(0, 168, 198, .12); }
  .me-pref .n { font-size: 12px; color: var(--ts-text-2); font-variant-numeric: tabular-nums; }
  .me-pref .mini { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: var(--ts-surface-2); overflow: hidden; }
  .me-pref .mini > i { display: block; height: 100%; background: var(--ts-green); }
  .me-pref.done .name::after { content: " 👑"; }
  .me-recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .me-recent button { width: 100%; display: flex; justify-content: space-between; gap: 8px; border: none; background: var(--ts-surface-2);
                      color: var(--ts-text); border-radius: 8px; padding: 8px 10px; font: 14px/1.3 var(--ts-font); cursor: pointer; text-align: left; }
  .me-recent .d { font-size: 12px; color: var(--ts-text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .me-empty { font-size: 13px; color: var(--ts-text-2); margin: 0; }
  .me-error { padding: 28px 12px; text-align: center; color: var(--ts-text-2); }

  @media (max-width: 860px) {
    .me-layout { grid-template-columns: 1fr; }
    #map { height: 62vh; }
    .me-prefs { max-height: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
  }
  @media (max-width: 520px) {
    .me-summary { grid-template-columns: 1fr; }
    .me-seg { width: 100%; }
    .me-seg button { flex: 1; }
  }
</style>

<script>
(function () {
  "use strict";
  var M = window.TSSMichiNoEki;
  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var MASTER_DOC = "MicinoEki/Er8LxHYCLfcEu9Oy7dTE";
  var MASTER_CACHE = "michinoeki.master";
  var GREEN = "#228B22", GRAY = "#8E8E93", TEAL = "#00A8C6";

  var state = { master: null, visits: [], items: [], filter: "all", selected: null, prefecture: "",
                user: null, backupDate: null, autoSync: false, failed: false };
  var map = null, markers = {}, mapsWaiters = [], clusterer = null, clusterKey = null, clusterSel = null, iconCache = {}, itemsVersion = 0;

  window.onMichiNoEkiMapsReady = function () { mapsWaiters.splice(0).forEach(function (f) { f(); }); mapsWaiters = null; };
  function whenMaps(f) { if (mapsWaiters === null) f(); else mapsWaiters.push(f); }

  function fmtDate(t) { var d = new Date(t); return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(); }

  // ---- 読み込み ----
  async function loadMaster(db) {
    var doc = await db.doc(MASTER_DOC).get();
    var fileName = doc.exists ? doc.data().fileName : null;
    if (!fileName) throw new Error("no fileName");
    try {
      var cached = JSON.parse(localStorage.getItem(MASTER_CACHE) || "null");
      if (cached && cached.fileName === fileName && Array.isArray(cached.list)) return cached.list;
    } catch (e) { /* 読めなければ取り直す */ }
    var url = await firebase.storage().ref("Json/" + fileName).getDownloadURL();
    var list = await (await fetch(url)).json();
    try { localStorage.setItem(MASTER_CACHE, JSON.stringify({ fileName: fileName, list: list })); } catch (e) { /* 入らなくてもよい */ }
    return list;
  }

  async function loadVisits(db, uid) {
    var snap = await db.collection("micinoEkiBackUp").doc(uid).get();
    if (!snap.exists) return { visits: [], date: null, autoSync: false };
    var data = snap.data() || {};
    return { visits: M.parseBackup(data.backupData) || [],
             date: data.backupDate && data.backupDate.toDate ? data.backupDate.toDate() : null,
             autoSync: data.autoSync === true };
  }

  function rebuild() {
    state.items = M.items(state.master || [], state.visits);
    itemsVersion += 1;
    render();
  }

  // ---- 表示 ----
  function render() {
    var items = state.items;
    var visited = items.filter(M.isVisited).length;
    el("visited").textContent = state.user ? visited : "–";
    el("total").textContent = "/ " + items.length.toLocaleString() + " 駅に行きました";
    el("bar").style.width = (items.length && state.user ? (visited / items.length * 100) : 0) + "%";
    renderNote();
    renderPrefs();
    renderRecent();
    renderMarkers();
    renderCard();
  }

  function renderNote() {
    var n = el("note");
    if (state.failed) { n.textContent = "道の駅を読み込めませんでした。時間をおいて開き直してください。"; return; }
    if (!state.master) { n.textContent = "道の駅を読み込んでいます…"; return; }
    if (!state.user) {
      n.innerHTML = '全国 ' + state.items.length.toLocaleString() + ' 駅の道の駅です。<a href="/login.html?redirect=' + encodeURIComponent("/michinoeki.html") +
        '">ログイン</a>すると、アプリで記録した訪問が緑で出ます。';
      return;
    }
    var how = "アプリの「実績」›「道の駅訪問」で「Webの道の駅マップにも出す」をオンにすると、訪問を記録するたびにここへ届きます。";
    if (!state.backupDate) { n.textContent = "まだアプリから訪問が届いていません。" + how; return; }
    n.textContent = state.autoSync
      ? "アプリから " + fmtDate(state.backupDate) + " に届いた訪問を出しています。"
      : "アプリのバックアップ（" + fmtDate(state.backupDate) + "）の訪問を出しています。" + how;
  }

  function renderPrefs() {
    var prefs = M.prefectures(state.items);
    var html = '<li><button type="button" class="me-pref" data-pref="" aria-pressed="' + (state.prefecture === "") + '"><span class="name">全国</span><span class="n"></span></button></li>';
    html += prefs.map(function (p) {
      var pct = p.total ? Math.round(p.visited / p.total * 100) : 0;
      return '<li><button type="button" class="me-pref' + (p.complete && state.user ? " done" : "") + '" data-pref="' + esc(p.name) + '" aria-pressed="' + (state.prefecture === p.name) + '">' +
        '<span class="name">' + esc(p.name) + '</span><span class="n">' + (state.user ? p.visited : "–") + " / " + p.total + '</span>' +
        '<span class="mini" aria-hidden="true"><i style="width:' + (state.user ? pct : 0) + '%"></i></span></button></li>';
    }).join("");
    el("prefs").innerHTML = html;
  }

  function renderRecent() {
    var list = state.user ? M.recent(state.items, 5) : [];
    el("recent-box").hidden = !list.length;
    el("recent").innerHTML = list.map(function (r) {
      return '<li><button type="button" data-id="' + esc(r.id) + '"><span>' + esc(r.name) + '</span><span class="d">' + fmtDate(r.date) + '</span></button></li>';
    }).join("");
  }

  /** 丸の絵（大きさ・色ごとに1回だけ作って使い回す） */
  function dotIcon(fill, stroke, strokeW, r) {
    var key = [fill, stroke, strokeW, r].join("|");
    if (iconCache[key]) return iconCache[key];
    var size = 2 * (r + strokeW);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 +
      '" r="' + (r + strokeW / 2) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeW + '"/></svg>';
    return (iconCache[key] = { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
                               scaledSize: new google.maps.Size(size, size), anchor: new google.maps.Point(size / 2, size / 2) });
  }

  function icon(item, selected) {
    var v = M.isVisited(item);
    if (selected) return dotIcon(v ? GREEN : GRAY, TEAL, 4, v ? 10 : 8);
    return v ? dotIcon(GREEN, "#fff", 2, 6) : dotIcon(GRAY, "#fff", 1.5, 4.5);
  }

  /**
   * まとまりの丸。訪問済みの割合を緑の扇で描き、真ん中に駅の数（絵は大きさ×割合10段ごとに使い回す）
   * ⚠️ 未ログイン・「まだ」で絞ったときは全部灰色、「訪問済み」で絞ったときは全部緑になる
   */
  function clusterIcon(count, visited) {
    var size = count < 10 ? 32 : count < 50 ? 38 : count < 200 ? 46 : 54;
    var step = visited === 0 ? 0 : visited === count ? 10 : Math.min(9, Math.max(1, Math.round(visited / count * 10)));
    var key = "c|" + size + "|" + step;
    if (iconCache[key]) return iconCache[key];
    var c = size / 2, r = c - 2, inner = r - 5;
    var ring;
    if (step === 0 || step === 10) {
      ring = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="' + (step ? GREEN : GRAY) + '"/>';
    } else {
      var a = step / 10 * 2 * Math.PI, x = c + r * Math.sin(a), y = c - r * Math.cos(a);
      ring = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="' + GRAY + '"/>' +
        '<path d="M' + c + ',' + c + ' L' + c + ',' + (c - r) + ' A' + r + ',' + r + ' 0 ' + (a > Math.PI ? 1 : 0) + ',1 ' + x.toFixed(2) + ',' + y.toFixed(2) + ' Z" fill="' + GREEN + '"/>';
    }
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '">' +
      '<circle cx="' + c + '" cy="' + c + '" r="' + (r + 1) + '" fill="#fff"/>' + ring +
      '<circle cx="' + c + '" cy="' + c + '" r="' + inner + '" fill="#1f2d2a" fill-opacity=".72"/></svg>';
    return (iconCache[key] = { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
                               scaledSize: new google.maps.Size(size, size), anchor: new google.maps.Point(c, c) });
  }

  var clusterRenderer = {
    render: function (cluster) {
      var visited = cluster.markers.filter(function (m) { return m.meVisited; }).length;
      var count = cluster.count;
      return new google.maps.Marker({ position: cluster.position, icon: clusterIcon(count, visited), zIndex: 1000 + count,
        label: { text: String(count), color: "white", fontSize: count < 100 ? "12px" : "11px", fontWeight: "bold" },
        title: count + "駅" + (state.user ? "（訪問済み " + visited + "）" : "") });
    }
  };

  /**
   * 地図の点。⚠️ まとめて出す（markerclusterer。利用者の要望 2026-10-30:「重たいため」）: 全駅の点は1回だけ作り、
   * 近いものは数の丸にまとめる（丸を押すと寄って広がる）。見えている範囲だけまとめる（SuperClusterViewportAlgorithm）
   * ⚠️ 選んだ駅はまとめず、いつも地図に出す（まとまりの中に隠れないように）
   * ⚠️ 絞り込み・選択・訪問が変わったときだけ入れ直す。色は変わった点だけ塗り直す（全部に setIcon すると重い）
   * ⚠️ まとめる部品が読めなかったら、前のやり方（全部の点を直接出す）
   */
  function renderMarkers() {
    if (!map) return;
    var shown = [], selMarker = null;
    state.items.forEach(function (item) {
      var m = markers[item.id];
      if (!m) {
        m = new google.maps.Marker({ position: { lat: item.lat, lng: item.lng }, title: item.name, optimized: true });
        m.addListener("click", function () { select(item.id, false); });
        markers[item.id] = m;
      }
      var sel = item.id === state.selected, ic = icon(item, sel);
      m.meVisited = M.isVisited(item);
      if (m.getIcon() !== ic) { m.setIcon(ic); m.setZIndex(sel ? 3 : (m.meVisited ? 2 : 1)); }
      if (sel) selMarker = m;
      else if (M.shows(state.filter, item)) shown.push(m);
    });
    var MC = window.markerClusterer;
    if (!(MC && MC.MarkerClusterer)) {
      state.items.forEach(function (item) {
        var m = markers[item.id], on = m === selMarker || M.shows(state.filter, item);
        if (on !== (m.getMap() === map)) m.setMap(on ? map : null);
      });
      return;
    }
    var key = state.filter + "|" + state.selected + "|" + itemsVersion;
    if (!clusterer) {
      // ⚠️ 部品より先に地図が出来ていたら、直接出していた点を下ろしてから任せる
      state.items.forEach(function (item) { var m = markers[item.id]; if (m !== selMarker && m.getMap()) m.setMap(null); });
      clusterer = new MC.MarkerClusterer({
        map: map, markers: shown, renderer: clusterRenderer,
        algorithm: new MC.SuperClusterViewportAlgorithm({ maxZoom: 13, radius: 70, viewportPadding: 60 }),
        onClusterClick: function (e, cluster, m) { select(null); m.fitBounds(cluster.bounds, 40); }
      });
    } else if (key !== clusterKey) {
      // ⚠️ 前に選んでいた点は外で出していたので、先に下ろす（絞り込みで外れたり見えない範囲だと残ってしまう）
      if (clusterSel && clusterSel !== selMarker) clusterSel.setMap(null);
      clusterer.clearMarkers(true);
      // ⚠️ 部品が地図に付く前（onAdd の前）に描かせると落ちる（getProjection が null）。付いたら部品が自分で描く
      clusterer.addMarkers(shown, !clusterer.getProjection());
    }
    clusterKey = key;
    clusterSel = selMarker;
    if (selMarker && selMarker.getMap() !== map) selMarker.setMap(map);
  }

  function renderCard() {
    var card = el("card");
    var item = state.items.find(function (i) { return i.id === state.selected; });
    if (!item) { card.hidden = true; card.innerHTML = ""; return; }
    var dates = item.visitDates;
    var visits = !state.user
      ? '<div class="visits u">ログインすると訪問が出ます</div>'
      : dates.length
        ? '<div class="visits v">✓ 訪問 ' + dates.length + '回・最後 ' + fmtDate(dates[dates.length - 1]) + '</div>' +
          (dates.length > 1 ? '<div class="first">はじめて ' + fmtDate(dates[0]) + '</div>' : "")
        : '<div class="visits u">まだ訪問していません</div>';
    var gmaps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.lat + "," + item.lng);
    card.innerHTML = '<button type="button" class="me-close" aria-label="閉じる">✕</button>' +
      '<h3>' + esc(item.name) + '</h3>' + (item.prefecture ? '<div class="pref">' + esc(item.prefecture) + '</div>' : "") + visits +
      '<div class="links"><a href="' + gmaps + '" target="_blank" rel="noopener">Google マップで開く</a></div>';
    card.hidden = false;
    card.querySelector(".me-close").onclick = function () { select(null); };
  }

  function select(id, pan) {
    state.selected = id;
    renderMarkers();
    renderCard();
    var item = id && state.items.find(function (i) { return i.id === id; });
    if (item && pan && map) { map.panTo({ lat: item.lat, lng: item.lng }); if (map.getZoom() < 10) map.setZoom(11); }
  }

  function fit(prefecture) {
    if (!map) return;
    var list = state.items.filter(function (i) { return !prefecture || i.prefecture === prefecture; });
    if (!list.length) return;
    if (list.length === 1) { map.setCenter({ lat: list[0].lat, lng: list[0].lng }); map.setZoom(11); return; }
    var b = new google.maps.LatLngBounds();
    list.forEach(function (i) { b.extend({ lat: i.lat, lng: i.lng }); });
    map.fitBounds(b, 24);
  }

  function initMap() {
    map = new google.maps.Map(el("map"), {
      center: { lat: 37.5, lng: 137.5 }, zoom: 5, streetViewControl: false, mapTypeControl: false,
      fullscreenControl: true, clickableIcons: false, gestureHandling: "greedy"
    });
    map.addListener("click", function () { select(null); });
    if (state.items.length) { renderMarkers(); fit(""); }
  }

  // ---- 操作 ----
  document.querySelectorAll(".me-seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.filter = b.getAttribute("data-filter");
      document.querySelectorAll(".me-seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      renderMarkers();
    });
  });
  el("prefs").addEventListener("click", function (e) {
    var b = e.target.closest(".me-pref"); if (!b) return;
    state.prefecture = b.getAttribute("data-pref") || "";
    state.selected = null;
    renderPrefs(); renderMarkers(); renderCard();
    fit(state.prefecture);
    if (window.innerWidth <= 860) el("map").scrollIntoView({ behavior: "smooth", block: "center" });
  });
  el("recent").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]"); if (!b) return;
    select(b.getAttribute("data-id"), true);
    if (window.innerWidth <= 860) el("map").scrollIntoView({ behavior: "smooth", block: "center" });
  });

  // ---- 起動 ----
  var s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyCBayWrK7IGm5Ceow4uQ_kt02Y2YJaKdG4&callback=onMichiNoEkiMapsReady";
  s.async = true;
  document.head.appendChild(s);
  whenMaps(initMap);

  window.addEventListener("load", function () {
    var tries = 0;
    (function ready() {
      if (typeof firebase === "undefined" || !firebase.firestore || !firebase.storage) {
        if (tries++ < 50) return setTimeout(ready, 100);
        state.failed = true; renderNote(); return;
      }
      var db = firebase.firestore();
      loadMaster(db).then(function (list) {
        state.master = list;
        rebuild();
        if (map) fit("");
      }).catch(function (e) { console.warn("道の駅の一覧を読めなかった", e); state.failed = true; renderNote(); });
      firebase.auth().onAuthStateChanged(function (user) {
        state.user = user || null;
        if (!user) { state.visits = []; state.backupDate = null; rebuild(); return; }
        loadVisits(db, user.uid).then(function (r) {
          state.visits = r.visits; state.backupDate = r.date; state.autoSync = r.autoSync;
          rebuild();
        }).catch(function (e) { console.warn("訪問を読めなかった", e); rebuild(); });
      });
    })();
  });
})();
</script>
</body>
</html>
