<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おすすめ道路 調整ツール</title>
<!--
  おすすめ道路の手直し用。ローカル専用（http://127.0.0.1:4317/roads）。

  できること
    ・生成結果を地図で見ながら、非表示／押し上げ／表示名／ひとこと説明を付ける
      → data/road-overrides/<romaji>.json に保存。再生成しても消えない
    ・重みを触って順位がどう動くか見る
      → data/road-tuning/*.json（ポリライン抜きの軽い版）でブラウザ側が再計算

  ⚠️ 重みスライダーは「見るだけ」。実際に反映するには lib/funSegments.js の
     WEIGHTS を書き換えて再生成する必要がある（画面から保存はしない）。
     数字を勝手に変えると、配信済みのものと食い違うため。

  ⚠️ overrideKey() は lib/roadOverrides.js と同じ式でなければならない。
     ずれると保存した調整が生成時に当たらず、エラーも出ないまま反映されない。
     test/keyParity.test.js が両者を突き合わせている。
-->
<style>
  :root {
    --line:#e2e5e9; --muted:#6b7280; --accent:#00a8c6; --warn:#e8590c;
    --sel:#e8590c; --ok:#2b8a3e; --bg:#fbfcfd;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; color:#222; }
  kbd { font:11px/1 monospace; background:#eef2f5; border:1px solid var(--line);
        border-bottom-width:2px; border-radius:3px; padding:2px 4px; }

  header { display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; white-space:nowrap; }
  .spacer { flex:1; }
  .tab { padding:5px 14px; border:1px solid var(--line); border-radius:999px; background:#fff; cursor:pointer; font:inherit; }
  .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .unsaved { color:var(--warn); font-weight:600; }

  main { display:flex; height:calc(100vh - 45px); }

  /* 一覧 */
  #list { width:330px; min-width:330px; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .bar { padding:7px 10px; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; }
  .bar.wrap { flex-wrap:wrap; }
  #rows { overflow-y:auto; flex:1; }
  .row { padding:5px 10px; border-bottom:1px solid #f0f2f4; cursor:pointer; display:flex; gap:7px; align-items:baseline; }
  .row:hover { background:#f6f8fa; }
  .row.sel { background:#fff1e6; box-shadow:inset 3px 0 0 var(--sel); }
  .row.off { opacity:.4; }
  .row .rank { color:var(--muted); font-size:11px; min-width:26px; text-align:right; font-variant-numeric:tabular-nums; }
  .row .name { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .sub { color:var(--muted); font-size:11px; white-space:nowrap; }
  .row .score { font-variant-numeric:tabular-nums; min-width:36px; text-align:right; }
  .row .mark { font-size:10px; }

  /* 地図 */
  #map { flex:1; min-width:280px; }

  /* 編集パネル（常に見える） */
  #editor { width:320px; min-width:320px; border-left:1px solid var(--line); background:var(--bg);
            overflow-y:auto; padding:12px; }
  #editor h3 { margin:0 0 2px; font-size:15px; }
  #editor .stats { color:var(--muted); font-size:11px; margin-bottom:10px; }
  #editor label { display:block; margin:10px 0 3px; font-size:11px; color:var(--muted); font-weight:600; }
  #editor input[type=text], #editor input[type=number] { width:100%; padding:5px 7px; border:1px solid var(--line);
            border-radius:6px; font:inherit; }
  .empty { color:var(--muted); text-align:center; padding:40px 12px; font-size:12px; }

  .boostRow { display:flex; gap:4px; align-items:center; }
  .boostRow input { flex:1; min-width:0; text-align:center; font-variant-numeric:tabular-nums; }
  /* ボタンが折り返すと「＋ / 5」と2行になって読めなくなる */
  .boostRow button { white-space:nowrap; padding:5px 7px; }
  .chip { padding:3px 8px; border:1px solid var(--line); border-radius:999px; background:#fff;
          cursor:pointer; font:11px/1.4 inherit; white-space:nowrap; }
  .chip:hover { background:#eef2f5; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }

  button { padding:5px 11px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; font:inherit; white-space:nowrap; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:#c92a2a; }
  button:disabled { opacity:.4; cursor:default; }
  select, input[type=search] { padding:5px 7px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  input[type=search] { flex:1; min-width:0; }

  .warn { color:var(--warn); font-size:11px; padding:6px 10px; background:#fff4e6; border-bottom:1px solid var(--line); }
  .muted { color:var(--muted); font-size:11px; }

  /* 重みの試算 */
  #tuning { padding:14px 18px; overflow-y:auto; width:100%; }
  .slider { display:flex; align-items:center; gap:10px; margin:3px 0; max-width:560px; }
  .slider label { width:84px; font-size:12px; color:var(--muted); }
  .slider input { flex:1; }
  .slider .val { width:40px; text-align:right; font-variant-numeric:tabular-nums; font-size:12px; }
  table { border-collapse:collapse; width:100%; font-size:12px; margin-top:10px; }
  th,td { border-bottom:1px solid var(--line); padding:3px 8px; text-align:left; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .up { color:var(--ok); } .down { color:#c92a2a; }
</style>
</head>
<body>
<header>
  <h1>おすすめ道路 調整ツール</h1>
  <button class="tab on" id="tab-curate">区間の手直し</button>
  <button class="tab" id="tab-tune">重みの試算</button>
  <span class="spacer"></span>
  <span id="status" class="muted"></span>
  <span id="unsaved" class="unsaved"></span>
  <button class="primary" id="save" disabled>保存 <kbd>S</kbd></button>
</header>

<main id="view-curate">
  <div id="list">
    <div class="bar">
      <select id="pref"></select>
      <input type="search" id="q" placeholder="道路名で絞る">
    </div>
    <div class="bar wrap">
      <button class="chip on" data-filter="all">すべて</button>
      <button class="chip" data-filter="curated">調整済み</button>
      <button class="chip" data-filter="hidden">非表示</button>
      <span class="spacer"></span>
      <select id="sort">
        <option value="score">点数順</option>
        <option value="length">長さ順</option>
        <option value="curviness">曲率順</option>
        <option value="name">名前順</option>
      </select>
    </div>
    <div class="warn" id="unmatched" style="display:none"></div>
    <div id="rows"></div>
    <div class="bar muted" id="count"></div>
  </div>

  <div id="map"></div>

  <div id="editor"><div class="empty">左の一覧か地図の線を選ぶと<br>ここで手直しできます<br><br><kbd>↑</kbd><kbd>↓</kbd> で選択を移動</div></div>
</main>

<div id="tuning" style="display:none">
  <p class="muted" style="max-width:720px">
    重みを動かすと順位がどう変わるかを試算します。<strong>ここで保存はしません。</strong>
    採用するときは <code>lib/funSegments.js</code> の <code>WEIGHTS</code> を書き換えて
    <code>node buildRoadRecommend.js --build</code> を回してください。
  </p>
  <div id="sliders"></div>
  <div class="bar" style="border:0; padding-left:0">
    <select id="tunePref"></select>
    <button id="normalize">合計を1.0にそろえる</button>
    <button id="resetWeights">既定に戻す</button>
    <span class="muted" id="tuneSummary"></span>
  </div>
  <table><thead><tr>
    <th>順位</th><th>道路名</th><th class="num">現行</th><th class="num">試算</th>
    <th class="num">増減</th><th class="num">長さ</th><th class="num">曲率</th><th class="num">flow</th>
  </tr></thead><tbody id="tuneRows"></tbody></table>
</div>

<script>
const state = {
  romaji: null, prefName: "", segments: [], overrides: {}, selected: null,
  dirty: 0, map: null, lines: new Map(), weights: null, normalizers: null,
  classRank: null, tuning: null, defaults: null, filter: "all", visible: [],
};
const PRESET_TAGS = ["絶景", "ワインディング", "快走", "林道ぎみ", "要注意"];

const $ = (id) => document.getElementById(id);
const setStatus = (t) => { $("status").textContent = t; };

/** ⚠️ lib/roadOverrides.js の overrideKey と同じ式にすること */
function overrideKey(seg) {
  const r = (v) => (Math.round(v / 0.01) * 0.01).toFixed(2);
  return seg.name + "@" + r(seg.start[0]) + "," + r(seg.start[1]);
}

function decodePolyline(encoded) {
  const points = []; let index = 0, lat = 0, lng = 0;
  while (index < encoded.length) {
    for (const isLat of [true, false]) {
      let shift = 0, result = 0, b;
      do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (isLat) lat += d; else lng += d;
    }
    points.push({ lat: lat / 1e5, lng: lng / 1e5 });
  }
  return points;
}

const ov = (seg) => state.overrides[overrideKey(seg)] || {};
const adjustedScore = (seg) => Math.max(0, Math.min(100, seg.score + (ov(seg).boost || 0)));
const isCurated = (seg) => Object.keys(ov(seg)).length > 0;

// ---------- 読み込み ----------
async function loadPrefectures() {
  const r = await (await fetch("/api/roads/prefectures")).json();
  for (const sel of [$("pref"), $("tunePref")]) {
    sel.innerHTML = "";
    for (const p of r.prefectures) {
      const o = document.createElement("option");
      o.value = p.romaji;
      o.textContent = p.name + (p.built ? "" : "（未生成）") + (p.overrides ? ` ・調整${p.overrides}` : "");
      o.disabled = !p.built;
      sel.appendChild(o);
    }
  }
  const first = r.prefectures.find((p) => p.romaji === "tochigi" && p.built) || r.prefectures.find((p) => p.built);
  if (first) { $("pref").value = first.romaji; $("tunePref").value = first.romaji; await loadPrefecture(first.romaji); }
}

async function loadPrefecture(romaji) {
  if (state.dirty && !confirm(`保存していない調整が ${state.dirty}件 あります。破棄しますか？`)) {
    $("pref").value = state.romaji; return;
  }
  setStatus("読み込み中…");
  state.romaji = romaji;
  const [seg, o] = await Promise.all([
    (await fetch(`/api/roads/segments/${romaji}`)).json(),
    (await fetch(`/api/roads/overrides/${romaji}`)).json(),
  ]);
  state.segments = seg.segments || [];
  state.prefName = seg.prefecture || "";
  state.overrides = o.overrides || {};
  state.selected = null;
  setDirty(0);
  drawAll();
  render();
  fitPrefecture();
  setStatus(`${state.prefName}`);
}

function setDirty(n) {
  state.dirty = n;
  $("save").disabled = n === 0;
  $("unsaved").textContent = n ? `未保存 ${n}件` : "";
}
const touch = () => setDirty(state.dirty + 1);

// ---------- 一覧 ----------
function render() {
  const q = $("q").value.trim();
  let list = state.segments.map((s) => ({ seg: s, o: ov(s), score: adjustedScore(s) }));

  if (state.filter === "curated") list = list.filter((r) => isCurated(r.seg));
  else if (state.filter === "hidden") list = list.filter((r) => r.o.hidden);
  else list = list.filter((r) => !r.o.hidden);   // 既定では非表示を隠す

  if (q) list = list.filter((r) => r.seg.name.includes(q) || (r.o.title || "").includes(q));

  const sort = $("sort").value;
  const cmp = {
    score: (a, b) => b.score - a.score,
    length: (a, b) => b.seg.lengthKm - a.seg.lengthKm,
    curviness: (a, b) => b.seg.curviness - a.seg.curviness,
    name: (a, b) => a.seg.name.localeCompare(b.seg.name, "ja"),
  }[sort];
  list.sort(cmp);
  state.visible = list.map((r) => r.seg);

  const rows = $("rows");
  rows.innerHTML = "";
  list.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "row" + (state.selected === r.seg ? " sel" : "") + (r.o.hidden ? " off" : "");
    const marks = [];
    if (r.o.hidden) marks.push("🚫");
    if (r.o.boost) marks.push(r.o.boost > 0 ? "⬆︎" : "⬇︎");
    if (r.o.note) marks.push("💬");
    for (const t of (r.o.tags || [])) marks.push("🏷");
    div.innerHTML =
      `<span class="rank">${i + 1}</span>` +
      `<span class="name">${escapeHtml(r.o.title || r.seg.name)}</span>` +
      `<span class="mark">${marks.join("")}</span>` +
      `<span class="sub">${r.seg.lengthKm.toFixed(0)}km</span>` +
      `<span class="score">${r.score.toFixed(1)}</span>`;
    div.onclick = () => select(r.seg);
    rows.appendChild(div);
  });

  const curatedCount = state.segments.filter(isCurated).length;
  $("count").textContent = `${list.length}件を表示（全${state.segments.length}件 ・ 調整済み${curatedCount}件）`;

  // どの区間にも当たらない調整
  const live = new Set(state.segments.map(overrideKey));
  const orphan = Object.keys(state.overrides).filter((k) => !live.has(k));
  const box = $("unmatched");
  if (orphan.length) {
    box.style.display = "block";
    box.innerHTML = `当たらない調整が ${orphan.length}件（道が消えたか名前が変わった）<br>` +
      escapeHtml(orphan.slice(0, 3).join(" / ")) + ` <button id="dropOrphan">削除</button>`;
    $("dropOrphan").onclick = () => {
      for (const k of orphan) delete state.overrides[k];
      touch(); render();
    };
  } else box.style.display = "none";

  restyleLines();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ---------- 選択 ----------
function select(seg, { pan = true } = {}) {
  state.selected = seg;
  render();
  if (pan) panTo(seg);
  renderEditor();
  // 一覧の選択行が見えるように
  const i = state.visible.indexOf(seg);
  const row = $("rows").children[i];
  if (row) row.scrollIntoView({ block: "nearest" });
}

function move(delta) {
  if (!state.visible.length) return;
  const i = state.selected ? state.visible.indexOf(state.selected) : -1;
  const next = Math.max(0, Math.min(state.visible.length - 1, i + delta));
  select(state.visible[next]);
}

// ---------- 地図 ----------
function initMap() {
  state.map = new google.maps.Map($("map"), {
    center: { lat: 36.75, lng: 139.6 }, zoom: 9, mapTypeControl: false, streetViewControl: false,
  });
  loadWeights().then(loadPrefectures);
}
window.initMap = initMap;

/** 全区間の線を1度だけ作る。選択のたびに作り直すと地図がちらつく */
function drawAll() {
  state.lines.forEach((l) => l.setMap(null));
  state.lines.clear();
  for (const seg of state.segments) {
    const line = new google.maps.Polyline({
      path: decodePolyline(seg.polyline), map: state.map,
      strokeColor: "#00a8c6", strokeOpacity: 0.7, strokeWeight: 4,
    });
    line.addListener("click", () => select(seg, { pan: false }));
    state.lines.set(seg.id, line);
  }
}

/** 色だけ塗り替える（作り直さない） */
function restyleLines() {
  for (const seg of state.segments) {
    const line = state.lines.get(seg.id);
    if (!line) continue;
    const o = ov(seg);
    const selected = state.selected === seg;
    line.setOptions({
      strokeColor: selected ? "#e8590c" : o.hidden ? "#adb5bd" : o.boost ? "#2b8a3e" : "#00a8c6",
      strokeOpacity: selected ? 1 : o.hidden ? 0.35 : 0.7,
      strokeWeight: selected ? 7 : 4,
      zIndex: selected ? 100 : 1,
    });
  }
}

function boundsOf(segs) {
  const b = new google.maps.LatLngBounds();
  for (const seg of segs) for (const p of decodePolyline(seg.polyline)) b.extend(p);
  return b;
}

function fitPrefecture() {
  if (!state.segments.length) return;
  state.map.fitBounds(boundsOf(state.segments), 24);
}

function panTo(seg) {
  state.map.fitBounds(boundsOf([seg]), 60);
}

// ---------- 編集パネル ----------
function renderEditor() {
  const box = $("editor");
  const seg = state.selected;
  if (!seg) {
    box.innerHTML = `<div class="empty">左の一覧か地図の線を選ぶと<br>ここで手直しできます<br><br><kbd>↑</kbd><kbd>↓</kbd> で選択を移動</div>`;
    return;
  }
  const o = ov(seg);
  box.innerHTML = `
    <h3>${escapeHtml(o.title || seg.name)}</h3>
    <div class="stats">
      ${o.title ? escapeHtml(seg.name) + "<br>" : ""}
      ${seg.lengthKm.toFixed(1)}km ・ 曲率${seg.curviness.toFixed(0)} ・ flow${seg.flow.toFixed(1)} ・ ${seg.highway}<br>
      素点 ${seg.score.toFixed(1)}${o.boost ? ` → <strong>${adjustedScore(seg).toFixed(1)}</strong>` : ""}
    </div>

    <label>点数の加算</label>
    <div class="boostRow">
      <button data-boost="-10">−10</button>
      <button data-boost="-5">−5</button>
      <input type="number" id="e-boost" value="${o.boost || 0}" step="1" min="-100" max="100">
      <button data-boost="5">＋5</button>
      <button data-boost="10">＋10</button>
    </div>

    <label>表示名（空なら元の名前）</label>
    <input type="text" id="e-title" value="${escapeHtml(o.title || "")}" placeholder="例: 椿ライン">

    <label>ひとこと説明（アプリの一覧に出る）</label>
    <input type="text" id="e-note" value="${escapeHtml(o.note || "")}" placeholder="例: 相模湾を見下ろす定番">

    <label>札（アプリに2つまで出る）</label>
    <div class="chips" id="e-tags">
      ${PRESET_TAGS.map((t) => `<button class="chip ${(o.tags || []).includes(t) ? "on" : ""}" data-tag="${t}">${t}</button>`).join("")}
    </div>
    <input type="text" id="e-tags-free" value="${escapeHtml((o.tags || []).filter((t) => !PRESET_TAGS.includes(t)).join(","))}"
           placeholder="その他（カンマ区切り）" style="margin-top:5px">

    <label>一覧から外す</label>
    <button class="chip ${o.hidden ? "on" : ""}" id="e-hidden">${o.hidden ? "🚫 外している" : "一覧に出す"}</button>

    <div style="margin-top:16px; display:flex; gap:6px;">
      <button class="danger" id="e-clear" ${Object.keys(o).length ? "" : "disabled"}>調整を消す</button>
      <span class="spacer"></span>
      <button id="e-prev">↑ 前</button>
      <button id="e-next">↓ 次</button>
    </div>
    <div class="muted" style="margin-top:10px">変更はすぐ反映されます。<kbd>S</kbd> で保存。</div>`;

  // 加算ボタン
  box.querySelectorAll("[data-boost]").forEach((b) => {
    b.onclick = () => {
      const input = $("e-boost");
      input.value = Math.max(-100, Math.min(100, (Number(input.value) || 0) + Number(b.dataset.boost)));
      apply();
    };
  });
  // 札のプリセット
  box.querySelectorAll("#e-tags [data-tag]").forEach((b) => {
    b.onclick = () => { b.classList.toggle("on"); apply(); };
  });
  $("e-hidden").onclick = () => { $("e-hidden").classList.toggle("on"); apply(); };
  for (const id of ["e-boost", "e-title", "e-note", "e-tags-free"]) {
    $(id).onchange = apply;
  }
  $("e-clear").onclick = () => { delete state.overrides[overrideKey(seg)]; touch(); render(); renderEditor(); };
  $("e-prev").onclick = () => move(-1);
  $("e-next").onclick = () => move(1);
}

/** 編集パネルの内容を state に反映（保存はしない） */
function apply() {
  const seg = state.selected;
  if (!seg) return;
  const preset = [...document.querySelectorAll("#e-tags .chip.on")].map((b) => b.dataset.tag);
  const free = $("e-tags-free").value.split(",").map((t) => t.trim()).filter(Boolean);
  const next = {
    hidden: $("e-hidden").classList.contains("on"),
    boost: Number($("e-boost").value) || 0,
    title: $("e-title").value.trim() || null,
    note: $("e-note").value.trim() || null,
    tags: [...new Set([...preset, ...free])],
  };
  const key = overrideKey(seg);
  if (!next.hidden && !next.boost && !next.title && !next.note && !next.tags.length) delete state.overrides[key];
  else state.overrides[key] = next;
  touch();
  render();
  renderEditor();
}

async function save() {
  setStatus("保存中…");
  const r = await fetch(`/api/roads/overrides/${state.romaji}`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ overrides: state.overrides }),
  });
  const j = await r.json();
  setDirty(0);
  setStatus(`保存しました（調整 ${j.count}件）。配信するには再生成が必要です`);
}

// ---------- 重みの試算 ----------
async function loadWeights() {
  const r = await (await fetch("/api/roads/weights")).json();
  state.weights = { ...r.weights };
  state.defaults = { ...r.weights };
  state.normalizers = r.normalizers;
  state.classRank = r.classRank;
  renderSliders();
}

function renderSliders() {
  const box = $("sliders");
  box.innerHTML = "";
  for (const key of Object.keys(state.weights)) {
    const row = document.createElement("div");
    row.className = "slider";
    row.innerHTML = `<label>${key}</label>
      <input type="range" min="0" max="1" step="0.05" value="${state.weights[key]}">
      <span class="val">${state.weights[key].toFixed(2)}</span>`;
    row.querySelector("input").oninput = (e) => {
      state.weights[key] = Number(e.target.value);
      row.querySelector(".val").textContent = state.weights[key].toFixed(2);
      renderTuning();
    };
    box.appendChild(row);
  }
}

function scoreWith(seg, weights) {
  const n = state.normalizers;
  const clamp = (v) => (!isFinite(v) ? 0 : v < 0 ? 0 : v > 1 ? 1 : v);
  const s = {
    curviness: clamp(seg.curviness / n.curviness),
    flow: clamp(seg.flow / n.flow),
    length: clamp(Math.log1p(seg.lengthKm * 1000) / Math.log1p(n.length)),
    classRank: state.classRank[seg.highway] ?? 0.7,
    popularity: 0,
  };
  let total = 0;
  for (const [k, w] of Object.entries(weights)) total += (s[k] ?? 0) * w;
  return total * 100;
}

async function renderTuning() {
  if (!state.tuning) {
    setStatus("試算データ読み込み中…");
    state.tuning = (await (await fetch("/api/roads/tuning")).json()).prefectures;
    setStatus("");
  }
  const pref = state.tuning.find((p) => p.romaji === $("tunePref").value);
  const body = $("tuneRows");
  body.innerHTML = "";
  if (!pref) { $("tuneSummary").textContent = "試算データがありません（--build を実行してください）"; return; }

  const id = (s) => s.name + s.start.join();
  const before = new Map([...pref.segments].sort((a, b) => b.score - a.score).map((s, i) => [id(s), i + 1]));
  const after = pref.segments.map((s) => ({ ...s, next: scoreWith(s, state.weights) }))
                             .sort((a, b) => b.next - a.next);
  let moved = 0;
  after.slice(0, 40).forEach((s, i) => {
    const delta = (before.get(id(s)) ?? 0) - (i + 1);
    if (delta !== 0) moved++;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i + 1}</td><td>${escapeHtml(s.name)}</td>
      <td class="num">${s.score.toFixed(1)}</td><td class="num">${s.next.toFixed(1)}</td>
      <td class="num ${delta > 0 ? "up" : delta < 0 ? "down" : ""}">${delta > 0 ? "↑" + delta : delta < 0 ? "↓" + -delta : "－"}</td>
      <td class="num">${s.lengthKm.toFixed(1)}</td><td class="num">${s.curviness.toFixed(0)}</td><td class="num">${s.flow.toFixed(1)}</td>`;
    body.appendChild(tr);
  });
  const sum = Object.values(state.weights).reduce((a, b) => a + b, 0);
  $("tuneSummary").textContent =
    `${pref.prefecture} ${pref.segments.length}区間 ／ 上位40のうち ${moved}件が動く ／ 重みの合計 ${sum.toFixed(2)}` +
    (Math.abs(sum - 1) > 0.001 ? "（1.0 から外れています）" : "");
}

// ---------- 起動 ----------
$("pref").onchange = (e) => loadPrefecture(e.target.value);
$("q").oninput = render;
$("sort").onchange = render;
$("save").onclick = save;
$("tunePref").onchange = renderTuning;
$("resetWeights").onclick = () => { state.weights = { ...state.defaults }; renderSliders(); renderTuning(); };
$("normalize").onclick = () => {
  const sum = Object.values(state.weights).reduce((a, b) => a + b, 0);
  if (sum > 0) for (const k of Object.keys(state.weights)) state.weights[k] = Number((state.weights[k] / sum).toFixed(2));
  renderSliders(); renderTuning();
};
document.querySelectorAll("[data-filter]").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("[data-filter]").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    state.filter = b.dataset.filter;
    render();
  };
});
$("tab-curate").onclick = () => {
  $("tab-curate").classList.add("on"); $("tab-tune").classList.remove("on");
  $("view-curate").style.display = "flex"; $("tuning").style.display = "none";
};
$("tab-tune").onclick = () => {
  $("tab-tune").classList.add("on"); $("tab-curate").classList.remove("on");
  $("view-curate").style.display = "none"; $("tuning").style.display = "block";
  renderTuning();
};

document.addEventListener("keydown", (e) => {
  // 入力中はショートカットを効かせない
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "s" || e.key === "S") { if (state.dirty) save(); }
});

window.onbeforeunload = () => (state.dirty ? "保存していない調整があります" : undefined);
</script>
