<style>
  .rm-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
             grid-template-columns: minmax(280px, 380px) 1fr; }
  @media (max-width: 820px) { .rm-wrap { grid-template-columns: 1fr; } }
  .rm-panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .rm-label { font-size: 13px; font-weight: 700; color: var(--ts-text-2); margin-bottom: 6px; display: block; }
  .rm-note { font-size: 12px; color: var(--ts-text-2); margin: 8px 0 0; line-height: 1.5; }
  .rm-select, .rm-input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: var(--ts-radius-s);
                          border: 1px solid var(--ts-line); background: var(--ts-surface); color: var(--ts-text); font: inherit; }
  .rm-checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
  .rm-radios { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .rm-checks label.is-off { color: var(--ts-text-2); }

  /* 行き先の一覧（区間ごとの 有料・高速 の札。アプリの立ち寄り先の一覧と同じ） */
  .rm-stops { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .rm-stop { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; align-items: start; }
  .rm-stop__no { width: 22px; height: 22px; border-radius: 50%; background: #007AFF; color: #fff;
                 font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .rm-stop.is-final .rm-stop__no { background: #FF3B30; }
  .rm-stop.is-origin .rm-stop__no { background: var(--ts-text-2); }
  .rm-stop__name { line-height: 1.4; word-break: break-word; }
  .rm-stop__name small { color: var(--ts-text-2); }
  .rm-stop.is-road .rm-stop__name { color: var(--ts-green); }
  .rm-stop__legs { grid-column: 2; display: flex; gap: 6px; }
  .rm-leg { font: inherit; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; cursor: pointer;
            border: 1px solid transparent; background: var(--ts-teal); color: #fff; }
  .rm-leg.is-off { background: transparent; color: var(--ts-text-2); border-color: var(--ts-line); text-decoration: line-through; }
  .rm-leg:focus-visible, .rm-cand:focus-visible { outline: 2px solid var(--ts-teal); outline-offset: 2px; }

  /* 地図と凡例 */
  .rm-mapbox { display: flex; flex-direction: column; border-radius: var(--ts-radius); overflow: hidden;
               background: var(--ts-surface); box-shadow: var(--ts-shadow); min-width: 0; }
  .rm-map { min-height: 520px; flex: 1; background: var(--ts-surface-2); }
  .rm-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px;
               font-size: 12px; color: var(--ts-text-2); border-top: 1px solid var(--ts-line); }
  .rm-legend:empty { display: none; }
  .rm-legend__item { display: inline-flex; align-items: center; gap: 5px; }
  .rm-swatch { width: 16px; height: 4px; border-radius: 2px; display: inline-block; }
  /* ほかの候補の見本（白い芯に色の縁。地図の線と同じ形） */
  .rm-sample { width: 18px; height: 6px; border-radius: 3px; background: #fff; box-sizing: border-box;
               border: 2px solid var(--rm-c, #8E8E93); display: inline-block; flex: none; }

  /* 候補カード（アプリの候補カード: 距離・所要・行き先ごとの内訳・通る道の内訳・注意） */
  .rm-cands { display: flex; flex-direction: column; gap: 8px; }
  .rm-cand { text-align: left; padding: 12px; border-radius: 12px; border: 2px solid transparent;
             background: var(--ts-surface); color: var(--ts-text); cursor: pointer; font: inherit;
             display: flex; flex-direction: column; gap: 6px; box-shadow: var(--ts-shadow); }
  .rm-cand.on { border-color: var(--ts-teal); background: color-mix(in srgb, var(--ts-teal) 10%, var(--ts-surface)); }
  .rm-cand__head { display: flex; align-items: baseline; gap: 8px; }
  .rm-cand__head b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .rm-cand__head span { color: var(--ts-text-2); font-size: 14px; font-variant-numeric: tabular-nums; }
  .rm-cand__sum { font-size: 12px; color: var(--ts-text-2); }
  .rm-cand__legs { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--ts-text-2);
                   display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
  .rm-cand__legs li { display: flex; gap: 6px; }
  .rm-cand__legs li span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ts-text); }
  .rm-cand__tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .rm-tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .rm-tag--toll { color: #C46A00; }
  .rm-tag--warn { color: #C46A00; background: color-mix(in srgb, #FF9500 12%, transparent); border-color: transparent; }
  .rm-tag--severe { color: var(--ts-danger); background: color-mix(in srgb, var(--ts-danger) 10%, transparent); border-color: transparent; }

  .rm-fun { display: flex; flex-direction: column; gap: 6px; }
  .rm-fun__row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ts-text-2); }
  .rm-fun__row input[type="range"] { flex: 1; accent-color: var(--ts-green); }
  .rm-fun__value { min-width: 64px; text-align: right; font-weight: 700; color: var(--ts-green); font-size: 13px; }
  .rm-cand__fun { font-size: 12px; font-weight: 700; color: var(--ts-green); }
  .rm-cand__roads { font-size: 11px; color: var(--ts-text-2); }
  .rm-boost { background: transparent; color: var(--ts-green); border: 1.5px dashed var(--ts-green); }
  .rm-boost:disabled { opacity: .5; cursor: default; }
  .rm-msg { font-size: 14px; }
  .rm-msg.err { color: var(--ts-danger); }
  .rm-msg.ok { color: var(--ts-green); }
  .rm-state { max-width: 560px; margin: 48px auto; text-align: center; }
  /* ⚠️ スマホ幅で見出しの右のボタンが1文字ずつ折り返していた */
  .ts-header__action { white-space: nowrap; flex: none; }
  /* ⚠️ ボタン（.ts-btn）は display を決めているので、hidden 属性だけでは隠れない */
  .rm-panel [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    .rm-sample { background: #1C1C1E; }
    .rm-tag--toll, .rm-tag--warn { color: #FFB340; }
  }
</style>

<body class="ts-page">
  <header class="ts-header">
    <div>
      <h1 class="ts-header__title">🗺️ ルートを作る</h1>

    </div>
    <a class="ts-header__action" href="/touring-plan.html">プラン</a>
  </header>

  <main id="root"><div class="rm-state ts-muted">読み込み中…</div></main>

  <footer class="ts-footer">
    <nav aria-label="サイトの案内">
      <a href="/about.html">アプリ紹介</a>
      <a href="/support.html">サポート</a>
      <a href="/privacypolicy/privacypolicy.html">プライバシーポリシー</a>
      <a href="/termsofservice/termsofservice.html">利用規約</a>
    </nav>
    <div>© ツーリングスポットシェア（biketeilen）</div>
  </footer>

<script>
  /*
   * Web でルートを作る（利用者の判断 2026-10-08: サブスク限定・プランから作って保存 → アプリで開く）。
   * ⚠️ 経路サーバの Web 用の窓口（/v1/web/route。ホスティングから転送）を使う。サーバでもサブスクを確かめる
   * ⚠️ 頼み方はアプリ（RouteCandidatesView）と同じ: おすすめ道路は通り道を中継点として渡し、立ち寄り先で区切り、
   *    道の終点では引き返させない。地点の数は経路サーバの上限に収める（アプリの NavWaypointBudget と同じ式）
   * ⚠️ 利用者の要望（2026-10-09）:「web のルート生成をアプリと同じような設定で生成したい 線の色など」。
   *    設定（排気量・ETC 車載器・有料／高速／フェリー・立ち寄り先ごとの有料／高速・走る日時と祝日）と、
   *    地図（選んだ候補は道の種類で塗り分け・おすすめ道路を走る区間に金色の縁・ほかの候補はカードと同じ色の縁）、
   *    候補カード（距離・所要・行き先ごとの内訳・通る道の内訳・注意）、凡例をアプリにそろえる。
   * ⚠️ 利用者の判断（2026-10-09）: 楽しい道＋距離ガバも Web に持ってくる。道の選び方は route-maker-fun.js
   *    （admin/lib/appFunRoute.js から作る生成物・アプリの FunRouteBuilder と答え合わせ済み）、画面側のつなぎは
   *    route-maker-lib.js（アプリの RouteCandidatesView.loadFunRoute と同じ流れ: ふつうのルートを基準に、まわり方＋予算違いの案
   *    → 立ち寄り先のあいだに差し込んで引く → 往復・Uターン・輪・ゴールの通り過ぎの原因の道を外して組み直す → 予算を超えたら減らす）。
   *    ⚠️ 道の駅で休憩は Web には無い（経路サーバの窓口がホスティングに出ていない）
   * ⚠️ 作ったルートは web_routes/{uid}/routes に本人だけが読める形で保存する（出発地が自宅のことがある）
   */
  var fb = { db: null, auth: null, user: null };
  var plans = [], candidates = [], chosen = 0, lastRequest = null;
  /** プランごと・行き先ごとの区間の設定（{avoidTolls, avoidHighways}。null は全体の設定に従う） */
  var legsByPlan = {};
  var map = null, lines = [], markers = [];
  var mapsReady = false, onMapsReadyResolve = null;
  /** おすすめ道路（金色の縁）。索引は1回だけ読む・県のファイルは取り置く */
  var rr = { index: null, files: {}, roads: [], spans: {}, generation: 0 };
  /** 楽しい道の探索（世代・基準・使える道・覚えた原因の道・距離ガバの段） */
  var funCtx = null, funGeneration = 0, tasteCache = { loaded: false, fn: null };
  var FUN = window.TSSFun || null;
  function onMapsReady() { mapsReady = true; if (onMapsReadyResolve) onMapsReadyResolve(); }
  function waitMaps() { return mapsReady ? Promise.resolve() : new Promise(function (r) { onMapsReadyResolve = r; setTimeout(r, 6000); }); }

  // 計算部分は route-maker-lib.js（テストあり。アプリと同じ決めごと）
  var RM = window.TSSRouteMaker;
  var MAX_DESTINATION_POINTS = RM.MAX_DESTINATION_POINTS, DISPLACEMENTS = RM.DISPLACEMENTS;
  var esc = RM.esc, km = RM.km, dur = RM.dur;
  var toDestinations = RM.toDestinations, fitted = RM.fitted, buildBody = RM.buildBody, decodePolyline = RM.decodePolyline;

  // 設定は次に開いたときのために、この端末にだけ覚えておく（無くても動く）
  var SETTINGS_KEY = "tss.routeMaker.settings";
  function loadSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {}; } catch (e) { return {}; } }
  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ displacement: val("disp"), etc: checked("etc"),
        avoidTolls: checked("tolls"), avoidHighways: checked("highways"), avoidFerries: checked("ferries"),
        funWeight: Number(val("funWeight")) || 0 }));
    } catch (e) { /* 保存できない環境でも使える */ }
  }
  function el(id) { return document.getElementById(id); }
  function val(id) { return el(id).value; }
  function checked(id) { return el(id).checked; }

  // ---- 起動 ----
  window.addEventListener("load", function () {
    var tries = 0;
    (function ready() {
      if (typeof firebase === "undefined" || !firebase.auth) {
        if (tries++ < 50) return setTimeout(ready, 100);
        return renderState("Firebase を読み込めませんでした。ページを読み込み直してください。");
      }
      fb.db = firebase.firestore(); fb.auth = firebase.auth();
      fb.auth.onAuthStateChanged(boot);
    })();
  });

  function renderState(html) { el("root").innerHTML = '<div class="rm-state ts-card">' + html + "</div>"; }

  async function boot(user) {
    fb.user = user;
    if (!user) {
      return renderState('<p>ルートを作るにはログインしてください。</p><p><a class="ts-btn" href="/login.html?redirect=/route-maker.html">ログイン</a></p>');
    }
    var sub = window.TSSSubscription ? await window.TSSSubscription.forCurrentUser(true) : { isSubscribed: false };
    if (!sub.isSubscribed) {
      return renderState("<p><b>Web でのルート作成は、サブスク（Plus・Pro）の方だけ使えます。</b></p>" +
        '<p class="ts-muted">アプリの購入画面から加入できます。加入済みなら、アプリを一度開いてから読み込み直してください。</p>' +
        '<p><a class="ts-btn ts-btn--ghost" href="/about.html">プランを見る</a></p>');
    }
    try {
      var snap = await fb.db.collection("users").doc(user.uid).collection("touringPlans").orderBy("createdAt", "asc").get();
      plans = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .filter(function (p) { return (p.spots || []).length > 0; });
    } catch (e) {
      return renderState('<p class="rm-msg err">プランを読み込めませんでした: ' + esc(e.message) + "</p>");
    }
    if (!plans.length) {
      return renderState('<p>スポットや道の入ったツーリングプランがありません。</p><p><a class="ts-btn" href="/touring-plan.html">プランを作る</a></p>');
    }
    renderForm();
  }

  function renderForm() {
    var s = loadSettings();
    var disp = DISPLACEMENTS.some(function (d) { return d[0] === s.displacement; }) ? s.displacement : "large";
    el("root").innerHTML =
      '<div class="rm-wrap"><div class="rm-panel">' +
        '<div class="ts-card"><label class="rm-label" for="plan">プラン</label>' +
          '<select id="plan" class="rm-select">' + plans.map(function (p, i) {
            return '<option value="' + i + '">' + esc(p.name || "プラン") + "（" + (p.spots || []).length + "件）</option>"; }).join("") + "</select>" +
          '<ol id="stops" class="rm-stops"></ol>' +
          '<p class="rm-note">札を押すと、その行き先へ向かう区間だけ 有料・高速・楽しい道 を使う／使わないを変えられます（アプリの立ち寄り先の一覧と同じ）。</p></div>' +
        '<div class="ts-card"><span class="rm-label">出発地</span><div class="rm-radios">' +
          '<label><input type="radio" name="start" value="current" checked> 走るときの現在地から（アプリで開いたときの場所）</label>' +
          '<label><input type="radio" name="start" value="first"> プランの最初の場所から</label></div></div>' +
        '<div class="ts-card"><label class="rm-label" for="disp">バイク</label>' +
          '<select id="disp" class="rm-select">' + DISPLACEMENTS.map(function (d) {
            return '<option value="' + d[0] + '"' + (d[0] === disp ? " selected" : "") + ">" + d[1] + "</option>"; }).join("") + "</select>" +
          '<div class="rm-checks" style="margin-top:10px"><label><input type="checkbox" id="etc"' + (s.etc === false ? "" : " checked") + "> ETC 車載器あり</label></div>" +
          '<span class="rm-label" style="margin-top:12px">避ける道</span>' +
          '<div class="rm-checks">' +
            '<label><input type="checkbox" id="tolls"' + (s.avoidTolls ? " checked" : "") + "> 有料道路</label>" +
            '<label id="highwaysLabel"><input type="checkbox" id="highways"' + (s.avoidHighways ? " checked" : "") + "> 高速道路</label>" +
            '<label><input type="checkbox" id="ferries"' + (s.avoidFerries === false ? "" : " checked") + "> フェリー</label></div>" +
          '<p id="highwayNote" class="rm-note" hidden>125cc 以下は高速道路を走れないので、いつも避けます。</p>' +
          '<p id="etcNote" class="rm-note" hidden>ETC 専用のスマート IC は使わずに引きます。</p></div>' +
        '<div class="ts-card rm-fun"><label class="rm-label" for="funWeight" style="margin:0">楽しい道</label>' +
          '<div class="rm-fun__row"><span>最短</span><input type="range" id="funWeight" min="0" max="1" step="0.01" value="' +
            (Number(s.funWeight) >= 0 ? Number(s.funWeight) : 0) + '"><span>楽しい</span><span id="funValue" class="rm-fun__value"></span></div>' +
          '<p class="rm-note" style="margin:0">おすすめ道路を寄り道して通る案を足します（アプリと同じ選び方）。選んだ道の記録があると、好みに近い道を選びやすくします。</p></div>' +
        '<div class="ts-card"><span class="rm-label">走る日時</span>' +
          '<div class="rm-checks"><label><input type="checkbox" id="rideOn"> 走る日時を決める</label></div>' +
          '<div id="rideBox" hidden style="margin-top:10px">' +
            '<input type="datetime-local" id="rideAt" class="rm-input" aria-label="日時">' +
            '<div class="rm-checks" style="margin-top:8px"><label><input type="checkbox" id="holiday"> 祝日</label></div></div>' +
          '<p id="rideNote" class="rm-note"></p></div>' +
        '<button id="make" class="ts-btn ts-btn--block">ルートを作る</button>' +
        '<div id="cands" class="rm-cands"></div>' +
        '<button id="boost" class="ts-btn ts-btn--block rm-boost" hidden></button>' +
        '<button id="send" class="ts-btn ts-btn--block" hidden>このルートをアプリに送る</button>' +
        '<div id="msg" class="rm-msg" role="status"></div>' +
      '</div><div class="rm-mapbox"><div id="map" class="rm-map"></div><div id="legend" class="rm-legend"></div></div></div>';
    el("plan").onchange = showStops;
    Array.prototype.forEach.call(document.querySelectorAll('input[name="start"]'), function (r) { r.onchange = showStops; });
    ["disp", "etc", "tolls", "highways", "ferries", "funWeight"].forEach(function (id) {
      el(id).onchange = function () { saveSettings(); syncConditionUI(); renderStops(); };
    });
    el("funWeight").oninput = function () { el("funValue").textContent = RM.funWeightLabel(Number(val("funWeight"))); };
    el("rideOn").onchange = function () {
      // ⚠️ 決めたときだけ「いま」を初めの値に入れる。決めないときは送らない（アプリの「走る日時」と同じ）
      if (checked("rideOn") && !val("rideAt")) el("rideAt").value = localInputValue(new Date());
      if (!checked("rideOn")) el("holiday").checked = false;
      syncConditionUI();
    };
    el("make").onclick = makeRoute;
    el("send").onclick = sendToApp;
    el("boost").onclick = boostFun;
    if (!FUN) el("funWeight").disabled = true;
    syncConditionUI();
    showStops();
  }

  function localInputValue(d) {
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  /** 排気量で高速が使えないとき・ETC・走る日時の説明を出し分ける */
  function syncConditionUI() {
    var forbidden = RM.highwaysForbidden(val("disp"));
    el("highways").disabled = forbidden;
    el("highwaysLabel").classList.toggle("is-off", forbidden);
    el("highwayNote").hidden = !forbidden;
    el("etcNote").hidden = checked("etc");
    el("rideBox").hidden = !checked("rideOn");
    el("funValue").textContent = RM.funWeightLabel(Number(val("funWeight")));
    el("rideNote").textContent = checked("rideOn")
      ? "その日時に効いている規制だけを避けます。効いていない時間の規制は通ります。"
      : "決めないときは、時間や曜日で切られた規制も避けます。走れる道を回り込むことがあります。";
  }

  function currentPlanIndex() { return Number(val("plan")) || 0; }
  function currentPlan() { return plans[currentPlanIndex()]; }
  function startsAtCurrent() { return document.querySelector('input[name="start"]:checked').value === "current"; }
  function planLegs() { var k = currentPlanIndex(); return legsByPlan[k] || (legsByPlan[k] = []); }

  function conditions() {
    var rideAt = checked("rideOn") && val("rideAt") ? new Date(val("rideAt")) : null;
    return { displacement: val("disp"), avoidTolls: checked("tolls"),
             // ⚠️ 125cc 以下はいつも避ける（アプリの resolvedAvoidHighways）
             avoidHighways: checked("highways") || RM.highwaysForbidden(val("disp")),
             avoidFerries: checked("ferries"), etc: checked("etc"), funWeight: Number(val("funWeight")) || 0,
             rideAt: rideAt && isFinite(rideAt.getTime()) ? rideAt : null, isHoliday: !!rideAt && checked("holiday") };
  }

  /** プランの行き先に、区間の設定を付けたもの */
  function planDestinations() {
    var legs = planLegs();
    return toDestinations(currentPlan().spots || []).map(function (d, i) { return Object.assign({}, d, { legSetting: legs[i] || null }); });
  }

  /**
   * 「プランの最初の場所から」のときの出発地と行き先（最初が道なら入口から出て、その道を走る）。
   * ⚠️ 一覧・地図の番号・経路の頼み方をこれ1つで決める（番号がずれないように）
   */
  function splitOrigin(dests) {
    if (startsAtCurrent() || !dests.length) return { origin: null, dests: dests };
    var first = dests[0];
    if (first.kind === "road") {
      return { origin: first.approach[0], originName: first.name + "の入口",
               dests: [Object.assign({}, first, { approach: first.approach.slice(1) })].concat(dests.slice(1)) };
    }
    return { origin: { lat: first.lat, lng: first.lng }, originName: first.name, dests: dests.slice(1) };
  }

  function showStops() {
    candidates = []; lastRequest = null; rr.spans = {}; funCtx = null; funGeneration++;
    renderStops(); renderCandidates(); drawRoutes(); setMsg("");
  }

  /** 行き先の一覧（区間ごとの 有料・高速 の札つき） */
  function renderStops() {
    var dests = planDestinations(), defaults = RM.legDefaults(conditions());
    var originIsFirst = !startsAtCurrent() && dests.length && dests[0].kind !== "road";
    el("stops").innerHTML = dests.map(function (d, i) {
      var isOrigin = originIsFirst && i === 0, isFinal = i === dests.length - 1;
      var e = RM.effectiveLeg(d.legSetting, defaults);
      var chips = isOrigin ? "" : '<div class="rm-stop__legs">' +
        '<button type="button" class="rm-leg' + (e.avoidTolls ? " is-off" : "") + '" data-i="' + i + '" data-key="avoidTolls" aria-pressed="' + !e.avoidTolls +
          '" aria-label="この区間で有料道路を使う">有料</button>' +
        (defaults.highwaysForbidden ? "" : '<button type="button" class="rm-leg' + (e.avoidHighways ? " is-off" : "") + '" data-i="' + i +
          '" data-key="avoidHighways" aria-pressed="' + !e.avoidHighways + '" aria-label="この区間で高速道路を使う">高速</button>') +
        (FUN ? '<button type="button" class="rm-leg' + (e.funRoads ? "" : " is-off") + '" data-i="' + i + '" data-key="funRoads" aria-pressed="' +
          e.funRoads + '" aria-label="この区間で楽しい道を通る">楽しい道</button>' : "") + "</div>";
      return '<li class="rm-stop' + (d.kind === "road" ? " is-road" : "") + (isFinal ? " is-final" : "") + (isOrigin ? " is-origin" : "") + '">' +
        '<span class="rm-stop__no">' + (isOrigin ? "出" : i + (originIsFirst ? 0 : 1)) + "</span>" +
        '<span class="rm-stop__name">' + (d.kind === "road" ? "🛣️ " : "📍 ") + esc(d.name) +
          (d.section && d.section.entry ? " <small>" + esc(d.section.entry) + " → " + esc(d.section.goal || "") + "</small>" : "") +
          (isOrigin ? " <small>（出発地）</small>" : "") + "</span>" + chips + "</li>";
    }).join("");
    Array.prototype.forEach.call(el("stops").querySelectorAll(".rm-leg"), function (b) {
      b.onclick = function () {
        var i = Number(b.dataset.i), legs = planLegs();
        legs[i] = RM.toggledLeg(legs[i], b.dataset.key, RM.legDefaults(conditions()));
        renderStops();
      };
    });
  }

  function setMsg(text, kind) { var m = el("msg"); m.textContent = text; m.className = "rm-msg" + (kind ? " " + kind : ""); }

  function currentPosition() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject(new Error("この端末では現在地を取れません"));
      navigator.geolocation.getCurrentPosition(function (p) { resolve({ lat: p.coords.latitude, lng: p.coords.longitude }); },
        function () { reject(new Error("現在地を取れませんでした。「プランの最初の場所から」を選んでください")); },
        { enableHighAccuracy: false, timeout: 10000 });
    });
  }

  async function makeRoute() {
    var plan = currentPlan();
    var dests = planDestinations();
    var fromCurrent = startsAtCurrent();
    var origin, originName = null;
    setMsg("ルートを作っています…");
    el("make").disabled = true;
    try {
      if (fromCurrent) {
        // ⚠️ 下見のための現在地。保存する出発地には入れない（アプリで開いたときの現在地から引き直す）
        origin = await currentPosition();
      } else {
        var split = splitOrigin(dests);
        origin = split.origin; originName = split.originName; dests = split.dests;
        if (!dests.length) throw new Error("最初の場所のほかに行き先がありません");
      }
      var fit = fitted(dests, MAX_DESTINATION_POINTS);
      var cond = conditions();
      var token = await fb.user.getIdToken();
      var res = await fetch("/v1/web/route", { method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify(buildBody(origin, fit, cond)) });
      var out = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(out.error || ("経路を作れませんでした（" + res.status + "）"));
      candidates = [out.route].concat(out.alternates || []).filter(Boolean);
      candidates.forEach(function (c) { c.path = decodePolyline(c.polyline || ""); });
      chosen = 0;
      lastRequest = { plan: plan, origin: origin, originName: originName, fromCurrent: fromCurrent, destinations: dests,
                      fitted: fit, conditions: cond };
      rr.spans = {}; funCtx = null; funGeneration++;
      renderCandidates(); drawRoutes();
      loadRecommendedRoads();
      setMsg(candidates.length ? "候補を選んで、アプリに送ってください" : "経路が見つかりませんでした", candidates.length ? "" : "err");
      // ⚠️ 楽しい道はふつうのルートを基準にする（遠回りの基準・進み具合の形）。ふつうのルートが出てから探す
      if (candidates.length && FUN && RM.funLegs(fit, RM.legDefaults(cond)).length) await searchFun();
    } catch (e) {
      setMsg(e.message, "err");
    } finally {
      el("make").disabled = false;
    }
  }

  /** 候補の注意（避けきれなかった有料・規制・ETC 専用 IC・フェリー・U ターン） */
  function noticesOf(c, cond) {
    var out = [];
    if ((c.restrictionHits || []).length) out.push({ text: "規制のある道 " + c.restrictionHits.length + "か所", severe: true });
    if (cond.avoidTolls && c.tollUnavoidableMeters > 0) out.push({ text: "避けきれない有料 " + km(c.tollUnavoidableMeters) });
    if (cond.etc === false && (c.etcOnlyIcs || []).length) out.push({ text: "ETC 専用の IC " + c.etcOnlyIcs.length + "か所", severe: true });
    if (cond.avoidFerries && c.ferryMeters > 0) out.push({ text: "フェリー " + km(c.ferryMeters) });
    if (c.uTurns > 0) out.push({ text: "U ターン " + c.uTurns + "回" });
    return out;
  }

  function renderCandidates() {
    var box = el("cands");
    if (!box) return;
    var r = lastRequest, cond = r ? r.conditions : conditions();
    box.innerHTML = candidates.map(function (c, i) {
      var on = i === chosen;
      var legs = r && r.destinations.length > 1 ? RM.legBreakdown(c, r.destinations) : [];
      var start = cond.rideAt ? cond.rideAt.getTime() : null, elapsed = 0;
      var legHtml = legs.length ? '<ul class="rm-cand__legs">' + legs.map(function (l) {
        elapsed += l.durationSeconds;
        var eta = start ? new Date(start + elapsed * 1000) : null;
        return "<li><span>" + esc(l.name) + "</span><span>" + km(l.distanceMeters) + "</span><span>" +
          (eta ? String(eta.getHours()).padStart(2, "0") + ":" + String(eta.getMinutes()).padStart(2, "0") + "着" : dur(l.durationSeconds)) + "</span></li>";
      }).join("") + "</ul>" : "";
      var tags = (on ? "" : '<span class="rm-sample" style="--rm-c:' + RM.candidateColor(i) + '" aria-hidden="true"></span>') +
        (RM.kindMeters(c, "toll") > 0 ? '<span class="rm-tag rm-tag--toll">¥ 有料</span>' : "") +
        noticesOf(c, cond).map(function (n) { return '<span class="rm-tag ' + (n.severe ? "rm-tag--severe" : "rm-tag--warn") + '">' + esc(n.text) + "</span>"; }).join("");
      return '<button type="button" class="rm-cand' + (on ? " on" : "") + '" data-i="' + i + '" aria-pressed="' + on + '">' +
        '<span class="rm-cand__head"><b>' + km(c.totalDistanceMeters) + "</b><span>" + dur(c.totalDurationSeconds) + "</span></span>" +
        funLine(c) +
        legHtml +
        '<span class="rm-cand__sum">' + esc(RM.compositionSummary(c)) + "</span>" +
        (tags ? '<span class="rm-cand__tags">' + tags + "</span>" : "") + "</button>";
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".rm-cand"), function (b) {
      b.onclick = function () { chosen = Number(b.dataset.i); renderCandidates(); drawRoutes(); };
    });
    el("send").hidden = !candidates.length;
    renderBoost();
    renderLegend();
  }

  /** 凡例（アプリの tollLegend: 選んだ候補に出ている道の種類・おすすめ道路（走るときだけ）・他の候補） */
  function renderLegend() {
    var box = el("legend");
    if (!box) return;
    var c = candidates[chosen];
    if (!c) { box.innerHTML = ""; return; }
    var kinds = RM.presentKinds(c);
    if (!kinds.length) kinds = [RM.kindInfo("surface")];
    var html = kinds.map(function (k) {
      return '<span class="rm-legend__item"><span class="rm-swatch" style="background:' + k.color + '"></span>' + k.label + "</span>"; }).join("");
    if ((spansFor(chosen) || []).length) {
      html += '<span class="rm-legend__item"><span class="rm-swatch" style="background:' + RM.RECOMMENDED_EDGE_COLOR + '"></span>おすすめ道路</span>';
    }
    if (candidates.length > 1) html += '<span class="rm-legend__item"><span class="rm-sample" aria-hidden="true"></span>他の候補</span>';
    box.innerHTML = html;
  }

  // ---- おすすめ道路（金色の縁）。⚠️ アプリと同じく配信中のおすすめ道路と重ねる（たまたま走る案でも光る） ----

  /** 選んだ候補がおすすめ道路を走る区間（求めたものは取り置く） */
  function spansFor(i) {
    if (!rr.roads.length || !candidates[i]) return [];
    if (!rr.spans[i]) rr.spans[i] = RM.recommendedSpans(candidates[i].path, rr.roads);
    return rr.spans[i];
  }

  /** 配信の索引（road_recommend/_index。県名・ローマ字・ファイル名）。1回だけ読む */
  async function recommendIndex() {
    if (!rr.index) {
      var doc = await fb.db.collection("road_recommend").doc("_index").get();
      rr.index = (doc.exists && doc.data().prefectures) || {};
    }
    return Object.keys(rr.index).map(function (k) { return rr.index[k]; }).filter(function (e) { return e && e.fileName; });
  }

  /** 県のおすすめ道路（配信の区間そのもの。Storage の Json/road_recommend/）。県ごとに取り置く・失敗した県は空 */
  async function loadSegments(names) {
    var entries = (await recommendIndex()).filter(function (e) { return names.indexOf(e.prefecture) >= 0; });
    var lists = await Promise.all(entries.map(function (e) {
      if (rr.files[e.fileName]) return rr.files[e.fileName];
      rr.files[e.fileName] = fetch("https://firebasestorage.googleapis.com/v0/b/biketeilen.appspot.com/o/" +
          encodeURIComponent("Json/road_recommend/" + e.fileName) + "?alt=media")
        .then(function (r) { return r.ok ? r.json() : { segments: [] }; })
        .then(function (f) { return f.segments || []; })
        .catch(function () { delete rr.files[e.fileName]; return []; });
      return rr.files[e.fileName];
    }));
    return [].concat.apply([], lists);
  }

  /** 経路が掛かる県のおすすめ道路を読む（索引 road_recommend/_index → Storage の Json/road_recommend/）。失敗しても縁が出ないだけ */
  async function loadRecommendedRoads() {
    var gen = ++rr.generation;
    rr.roads = [];
    try {
      if (typeof PREFECTURES === "undefined") return;
      var names = RM.prefecturesFor(candidates.map(function (c) { return c.path; }), PREFECTURES);
      if (!names.length) return;
      var segments = await loadSegments(names);
      if (gen !== rr.generation) return;
      rr.roads = segments.map(function (seg) { return decodePolyline(seg.polyline || ""); });
      rr.spans = {};
      renderLegend(); drawRoutes();
    } catch (e) {
      console.warn("おすすめ道路を読めませんでした", e);
    }
  }


  // ---- 楽しい道・距離ガバ（アプリの RouteCandidatesView.loadFunRoute と同じ流れ） ----

  /** 1つの案を確かめ直す回数・探索ぜんぶに使ってよい時間（アプリは45秒で打ち切る） */
  var FUN_MAX_RETRIES = 4, FUN_BOOST_RETRIES = 1, FUN_SEARCH_MS = 45000, FUN_PARALLEL = 3;
  /**
   * 往復の原因になった道（道路網の性質なので覚えてよい）。次の探索では最初から外す。
   * ⚠️ アプリも覚えている（NavRoutePreference.savedUTurnOnlySegmentIDs「学習したぶんは捨てない。捨てると毎回同じ区間で
   *    同じ回数取り直す」）。この端末にだけ置く（無くても動く）
   */
  var UTURN_KEY = "tss.routeMaker.uturnOnlySegments", UTURN_MAX = 300;
  function savedUTurnOnly() { try { return JSON.parse(localStorage.getItem(UTURN_KEY) || "[]") || []; } catch (e) { return []; } }
  function rememberUTurnOnly(ids) {
    try {
      var all = savedUTurnOnly().filter(function (id) { return ids.indexOf(id) < 0; }).concat(ids);
      localStorage.setItem(UTURN_KEY, JSON.stringify(all.slice(-UTURN_MAX)));
    } catch (e) { /* 覚えられなくても探せる */ }
  }
  function pairOf(p) { return [p.lng, p.lat]; }

  /** 候補に楽しい道の中身を付ける。⚠️ 数えない（JSON に出ない）ように付ける。アプリへ渡す道に混ぜない */
  function withFun(route, info) {
    route.path = decodePolyline(route.polyline || "");
    Object.defineProperty(route, "fun", { value: info, enumerable: false, configurable: true });
    return route;
  }

  /** 二輪が通れない規制（Firestore road_restrictions/<ローマ字>。誰でも読める）。線は先に読んでおく */
  async function loadRestrictions(names) {
    var entries = (await recommendIndex()).filter(function (e) { return names.indexOf(e.prefecture) >= 0 && e.romaji; });
    var docs = await Promise.all(entries.map(function (e) {
      return fb.db.collection("road_restrictions").doc(e.romaji).get()
        .then(function (d) { return (d.exists && d.data().restrictions) || []; }).catch(function () { return []; });
    }));
    return [].concat.apply([], docs).filter(function (r) { return r && r.polyline; }).map(function (r) {
      return Object.assign({}, r, { points: FUN.appFun.polylineOf({ polyline: r.polyline }) });
    });
  }

  /** 好み（選んだ記録 user_taste/{uid}。本人だけ読める）。無ければ null＝好みを使わない */
  async function loadTaste() {
    if (tasteCache.loaded) return tasteCache.fn;
    try {
      var doc = await fb.db.collection("user_taste").doc(fb.user.uid).get();
      tasteCache.fn = doc.exists ? RM.tasteFromChoices(doc.data(), FUN.rider) : null;
    } catch (e) { tasteCache.fn = null; }
    tasteCache.loaded = true;
    return tasteCache.fn;
  }

  async function requestRoute(body) {
    var token = await fb.user.getIdToken();
    var res = await fetch("/v1/web/route", { method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify(body) });
    var out = await res.json().catch(function () { return {}; });
    return res.ok && out.route ? out.route : null;
  }

  /** 同じ作り方（幅・予算・まわり方）で、使う道だけ変えて作り直す */
  function rebuildVariant(ctx, v, segments) {
    return FUN.appFun.build(Object.assign({}, ctx.common, { segments: segments, budgetRatio: v.recipe.budgetRatio,
      corridorScale: v.recipe.corridorScale, side: v.recipe.side, kind: v.kind }));
  }

  /**
   * 1つの案を引いて確かめる。往復・Uターン・輪・ゴールの通り過ぎの原因の道を外して作り直し、予算を超えたら道を減らす。
   * ⚠️ 直りきらない案は並べない（「無理やりその道に行かなくてよい」。アプリの dropTangledFunVariants）
   * @returns {Promise<{variant, route}|null>}
   */
  async function refineVariant(ctx, first, maxRetries) {
    var v = first, tries = 0, trims = 0, banned = {};
    while (v) {
      if (ctx.generation !== funGeneration) return null;
      var route = await requestRoute(RM.buildFunBody(ctx.origin, ctx.dests, v.waypoints, ctx.cond, FUN.geometry));
      if (!route) return null;
      var points = decodePolyline(route.polyline || "").map(pairOf);
      var found = RM.funCulprits(route, points, v.segments, ctx.goal, FUN.geometry, FUN.appFun);
      if (found.banned.length) {
        console.info("楽しい道: 余計に走らせた道を外して作り直します", found.banned.map(function (sgm) { return sgm.id + " " + (sgm.name || ""); }),
                     "（覚える: " + found.forever.map(function (sgm) { return sgm.id; }).join(",") + "）");
        // 道路網の性質（往復）は、ほかの案でも外し、次の探索でも外す
        found.forever.forEach(function (sgm) { ctx.foreverBanned[sgm.id] = true; });
        if (found.forever.length) rememberUTurnOnly(found.forever.map(function (sgm) { return sgm.id; }));
        found.banned.forEach(function (sgm) { banned[sgm.id] = true; });
        if (++tries > maxRetries || Date.now() > ctx.deadline) return null;
        v = rebuildVariant(ctx, v, ctx.common.segments.filter(function (sgm) { return !banned[sgm.id] && !ctx.foreverBanned[sgm.id]; }));
        continue;
      }
      // ⚠️ その案を作ったときの予算で測る（広げた案を作った端から刈らない）
      var limit = v.recipe.budgetRatio != null ? v.recipe.budgetRatio : RM.MAX_DETOUR_RATIO;
      if (route.totalDistanceMeters / ctx.baseline > limit && v.segments.length > 1 && trims < RM.MAX_FUN_TRIM_ATTEMPTS) {
        trims++;
        var kept = v.segments.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, -1);
        var smaller = rebuildVariant(ctx, v, kept);
        if (smaller) { v = smaller; continue; }
      }
      return { variant: v, route: route };
    }
    return null;
  }

  /** 案を3本ずつ引いて確かめる（経路サーバは全利用者で共有しているので、全部を一度には投げない） */
  async function refineAll(ctx, variants, maxRetries) {
    var out = new Array(variants.length), next = 0;
    async function worker() {
      while (next < variants.length) {
        var i = next++;
        out[i] = await refineVariant(ctx, variants[i], maxRetries);
        if (ctx.generation === funGeneration) setMsg("楽しい道を確かめています…（" + out.filter(Boolean).length + "）");
      }
    }
    var workers = [];
    for (var w = 0; w < FUN_PARALLEL; w++) workers.push(worker());
    await Promise.all(workers);
    return out.filter(Boolean);
  }

  /** 確かめた案を候補に足す（同じ道になったものは畳む。先に並んでいる候補を残す） */
  function addFunCandidates(ctx, results) {
    var fresh = results.map(function (x) {
      ctx.variants.push(x.variant);
      ctx.lineups[x.variant.segments.map(function (sgm) { return sgm.id; }).sort().join("|")] = true;
      return withFun(x.route, { label: RM.variantLabel(x.variant), segments: x.variant.segments, recipe: x.variant.recipe });
    });
    var wrap = function (c) { return { route: c, points: c.path.map(pairOf) }; };
    var merged = RM.mergeCandidates([candidates.map(wrap), fresh.map(wrap)], FUN.geometry).map(function (w) { return w.route; });
    var added = merged.length - candidates.length;
    var selected = candidates[chosen];
    candidates = merged;
    return { added: added, firstNew: added > 0 ? candidates.length - added : -1, keep: candidates.indexOf(selected) };
  }

  /** ふつうのルートを基準に、楽しい道の案を探す */
  async function searchFun() {
    var r = lastRequest, F = FUN;
    if (!r || !F || !candidates.length) return;
    var gen = ++funGeneration;
    var cond = Object.assign({}, r.conditions);
    var dests = r.fitted, defaults = RM.legDefaults(cond);
    var legs = RM.funLegs(dests, defaults);
    if (!legs.length) return;
    // ⚠️ つまみが「最短」のまま区間の札で楽しい道を入れたときは、全開で探す（アプリも区間で入れたら全開から）
    if (!(cond.funWeight >= RM.MIN_FUN_WEIGHT)) cond.funWeight = 1;
    var plain = candidates[0], goalDest = dests[dests.length - 1];
    var goal = { lat: goalDest.lat, lng: goalDest.lng };
    setMsg("楽しい道を探しています…");
    el("make").disabled = true;
    try {
      // 出発地と目的地を含む範囲の県（アプリと同じ: 中間点から、直線距離か30kmの大きいほう）
      var spanKm = F.geometry.distance(pairOf(r.origin), pairOf(goal)) / 1000;
      var center = { lat: (r.origin.lat + goal.lat) / 2, lng: (r.origin.lng + goal.lng) / 2 };
      var names = typeof PREFECTURES === "undefined" ? [] : RM.prefecturesWithin(center, Math.max(30, spanKm), PREFECTURES);
      var loaded = await Promise.all([loadSegments(names), loadRestrictions(names), loadTaste()]);
      if (gen !== funGeneration) return;
      var segments = loaded[0], restrictions = loaded[1], taste = loaded[2];
      // ⚠️ 二輪が通れない規制と300m以上重なる道は使わない（走る日時が無ければ時間を見ずに避ける）
      var usable = restrictions.length ? segments.filter(function (sgm) {
        return !F.appFun.isBlockedByRestrictions(F.appFun.polylineOf(sgm), restrictions, cond.displacement, cond.rideAt || undefined);
      }) : segments;
      // ⚠️ 前に往復の原因と分かった道は、最初から外す（アプリの bannedUTurnSegmentIDs）
      var known = savedUTurnOnly();
      usable = usable.filter(function (sgm) { return known.indexOf(sgm.id) < 0; });
      // ⚠️ 楽しい道を使う区間の上の道だけにする（区間の札）
      var searchable = legs.length < dests.length
        ? RM.filterFunSegments(usable, plain.path, dests.map(function (d) { return { lat: d.lat, lng: d.lng }; }), legs, F.geometry, F.appFun)
        : usable;
      var built = F.appFun.appFunVariants({ origin: pairOf(r.origin), destination: pairOf(goal), segments: searchable,
        funWeight: cond.funWeight, baselineMeters: plain.totalDistanceMeters, referencePolyline: plain.path.map(pairOf), taste: taste });
      var ctx = { generation: gen, origin: r.origin, goal: goal, dests: dests, cond: cond, baseline: plain.totalDistanceMeters,
                  common: built.common, foreverBanned: {}, variants: [], lineups: {}, corridor: 1,
                  deadline: Date.now() + FUN_SEARCH_MS };
      funCtx = ctx;
      if (!built.variants.length) {
        setMsg(segments.length ? "この行き先の近くに楽しい道が見つかりませんでした" : "この地域のおすすめ道路がまだありません");
        return;
      }
      var results = await refineAll(ctx, built.variants, FUN_MAX_RETRIES);
      if (gen !== funGeneration) return;
      if (!results.length) { setMsg("この行き先では、往復せずに通れる楽しい道の案を作れませんでした"); renderBoost(); return; }
      var add = addFunCandidates(ctx, results);
      if (add.firstNew >= 0) chosen = add.firstNew;
      rr.spans = {};
      renderCandidates(); drawRoutes(); loadRecommendedRoads();
      setMsg(add.added ? "楽しい道の案を " + add.added + " 本足しました。候補を選んで、アプリに送ってください"
                       : "楽しい道の案は、ふつうのルートと同じ道になりました");
    } catch (e) {
      console.warn("楽しい道を探せませんでした", e);
      setMsg("楽しい道を探せませんでした（" + e.message + "）", "err");
    } finally {
      if (gen === funGeneration) el("make").disabled = false;
    }
  }

  /** 距離ガバ: 回り込む幅と遠回りの上限を1段上げて、まわり方の案を足す（アプリの boostFunRoute / addFunRouteVariants） */
  async function boostFun() {
    var ctx = funCtx, F = FUN;
    if (!ctx || !F) return;
    var step = F.appFun.nextBoost(ctx.corridor);
    if (!step) return;
    ctx.corridor = step.corridorScale;
    ctx.deadline = Date.now() + FUN_SEARCH_MS;
    el("boost").disabled = true;
    setMsg("道をひろげて探しています…");
    try {
      var picked = F.appFun.buildSideVariants(Object.assign({}, ctx.common, {
        segments: ctx.common.segments.filter(function (sgm) { return !ctx.foreverBanned[sgm.id]; }),
        corridorScale: step.corridorScale, budgetRatio: step.budgetRatio }));
      // ⚠️ すでに出ている顔ぶれは足さない（広げても同じ道になることがある）
      var fresh = picked.filter(function (v) { return !ctx.lineups[v.segments.map(function (sgm) { return sgm.id; }).sort().join("|")]; });
      if (!fresh.length) { setMsg("これ以上ひろげても、同じ道にしかなりませんでした"); return; }
      var results = await refineAll(ctx, fresh, FUN_BOOST_RETRIES);
      if (ctx.generation !== funGeneration) return;
      var add = addFunCandidates(ctx, results);
      if (add.firstNew >= 0) chosen = add.firstNew; else if (add.keep >= 0) chosen = add.keep;
      rr.spans = {};
      renderCandidates(); drawRoutes(); loadRecommendedRoads();
      setMsg(add.added ? "ひろげた案を " + add.added + " 本足しました" : "ひろげてみましたが、いまと同じ道にしかなりませんでした");
    } catch (e) {
      setMsg("ひろげて探せませんでした（" + e.message + "）", "err");
    } finally {
      renderBoost();
    }
  }

  /** 距離ガバのボタン（何段まで進めたか n/3。最後まで広げても消さずに押せない形で残す） */
  function renderBoost() {
    var b = el("boost");
    if (!b) return;
    var ctx = funCtx;
    b.hidden = !(ctx && FUN && ctx.generation === funGeneration && candidates.length);
    if (b.hidden) return;
    var level = FUN.appFun.boostLevel(ctx.corridor), total = FUN.appFun.BOOST_STEPS.length;
    b.disabled = !FUN.appFun.nextBoost(ctx.corridor);
    b.textContent = "距離ガバでもっと広く探す（" + level + "/" + total + "）";
  }

  /** カードの楽しい道の行（案の名前・通る本数・遠回り・道の名前） */
  function funLine(c) {
    var f = c.fun;
    if (!f) return "";
    var base = funCtx ? funCtx.baseline : 0;
    // ⚠️ 上限（3倍）までは上限に対する割合、超えた案（距離ガバ）は「+○km（約○倍）」（アプリの detourDisplay）
    var detour = RM.detourText(c.totalDistanceMeters, base, RM.MAX_DETOUR_RATIO);
    var names = f.segments.map(function (sgm) { return sgm.title || sgm.name || sgm.ref || "おすすめ道路"; });
    return '<span class="rm-cand__fun">🌿 ' + esc(f.label) + "・楽しい道 " + f.segments.length + "本" + (detour ? "・" + esc(detour) : "") + "</span>" +
      '<span class="rm-cand__roads">' + esc(names.join("・")) + "</span>";
  }

  // ---- 地図 ----

  /** 地図の札（アプリの NavMapChip: 道の入口・出口）。where: "above"（点の上）・"below"（番号の丸の下）・"center" */
  function chipIcon(text, color, where) {
    var w = Math.min(220, 16 + Array.from(text).reduce(function (n, ch) { return n + (ch.charCodeAt(0) > 255 ? 11 : 6.5); }, 0));
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="20"><rect x="0.5" y="0.5" rx="9.5" width="' + (w - 1) +
      '" height="19" fill="' + color + '" stroke="#fff"/><text x="' + w / 2 + '" y="14" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" ' +
      'font-family="-apple-system,Hiragino Sans,sans-serif">' + esc(text) + "</text></svg>";
    return { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
             anchor: new google.maps.Point(w / 2, where === "below" ? -14 : where === "above" ? 24 : 10), scaledSize: new google.maps.Size(w, 20) };
  }
  function shortName(s) { var a = Array.from(String(s || "")); return a.length > 12 ? a.slice(0, 12).join("") + "…" : a.join(""); }

  function addLine(path, color, weight, z, opacity) {
    if (path.length < 2) return;
    lines.push(new google.maps.Polyline({ path: path, map: map, strokeColor: color, strokeOpacity: opacity == null ? 1 : opacity,
      strokeWeight: weight, zIndex: z, clickable: false }));
  }

  async function drawRoutes() {
    await waitMaps();
    if (!window.google || !google.maps) return;
    var box = el("map");
    if (!box) return;
    if (!map) map = new google.maps.Map(box, { center: { lat: 36, lng: 138.5 }, zoom: 7, mapTypeControl: false, streetViewControl: false });
    lines.forEach(function (l) { l.setMap(null); }); lines = [];
    markers.forEach(function (m) { m.setMap(null); }); markers = [];
    var bounds = new google.maps.LatLngBounds(), any = false;
    candidates.forEach(function (c, i) {
      c.path.forEach(function (p) { bounds.extend(p); any = true; });
      if (i === chosen) return;
      // ⚠️ ほかの候補はカードと同じ色の縁に白い芯（どの線がどのカードか分かるように。選んだ候補より下）
      addLine(c.path, RM.candidateColor(i), 7, 1);
      addLine(c.path, "#FFFFFF", 3, 2);
    });
    var sel = candidates[chosen];
    if (sel) {
      // ⚠️ おすすめ道路を走る区間に金色の縁（道の種類の線の下に太く敷いて、両側にはみ出したぶんが縁に見える）
      spansFor(chosen).forEach(function (sp) { addLine(sel.path.slice(sp[0], sp[1] + 1), RM.RECOMMENDED_EDGE_COLOR, 12, 3); });
      // 選んだ候補だけ道の種類で塗り分ける（ほかまで塗るとどれを選んでいるか分からない）
      RM.kindSegments(sel.path, sel.kindSpans).forEach(function (seg) { addLine(seg.path, RM.kindInfo(seg.kind).color, 6, 4); });
    }
    drawMarkers();
    markers.forEach(function (m) { bounds.extend(m.getPosition()); any = true; });
    if (any) map.fitBounds(bounds, 40);
  }

  /** 行き先の印（アプリと同じ: 途中は青・最後は赤。道は入口と出口に札） */
  function drawMarkers() {
    var r = lastRequest, preview = r ? null : splitOrigin(planDestinations());
    var dests = r ? r.destinations : preview.dests;
    var origin = r ? (r.fromCurrent ? null : r.origin) : preview.origin;
    if (origin) markers.push(new google.maps.Marker({ position: origin, map: map, zIndex: 5, title: "出発地",
      icon: chipIcon("出発", "#34C759", "center") }));
    dests.forEach(function (d, i) {
      var isFinal = i === dests.length - 1;
      markers.push(new google.maps.Marker({ position: { lat: d.lat, lng: d.lng }, map: map, title: d.name, zIndex: 6,
        label: { text: String(i + 1), color: "#fff", fontSize: "12px", fontWeight: "700" },
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 11, fillColor: isFinal ? "#FF3B30" : "#007AFF", fillOpacity: 1,
                strokeColor: "#fff", strokeWeight: 2 } }));
      if (d.kind === "road" && d.approach.length) {
        markers.push(new google.maps.Marker({ position: d.approach[0], map: map, zIndex: 7, title: "入口・" + d.name,
          icon: chipIcon("入口・" + shortName(d.name), "#FF9500", "above") }));
        markers.push(new google.maps.Marker({ position: { lat: d.lat, lng: d.lng }, map: map, zIndex: 7, title: "出口・" + d.name,
          icon: chipIcon("出口・" + shortName(d.name), "#48484A", "below") }));
      }
    });
  }

  /** 選んだ候補をアプリへ送る（web_routes/{uid}/routes。アプリの「保存したルート」に出る） */
  async function sendToApp() {
    if (!lastRequest || !candidates[chosen]) return;
    var c = candidates[chosen], r = lastRequest, cond = r.conditions;
    var name = (r.plan.name || "プラン") + "（Web）";
    var doc = {
      name: name.slice(0, 100),
      planId: r.plan.id, planName: String(r.plan.name || "").slice(0, 100),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      // ⚠️ 現在地から作ったときは出発地を保存しない（アプリはいまの場所から出る。Web の出発地から離れていれば、
      //    いまの場所から下の道へ合流させる＝WebRouteOpen）
      startsAtCurrentLocation: r.fromCurrent,
      origin: r.fromCurrent ? null : { lat: r.origin.lat, lng: r.origin.lng, name: String(r.originName || "").slice(0, 100) },
      destinations: r.destinations.map(function (d) {
        var o = { name: String(d.name || "").slice(0, 100), kind: d.kind, lat: d.lat, lng: d.lng,
                  approach: d.approach.map(function (p) { return { lat: p.lat, lng: p.lng }; }) };
        if (d.roadID) o.roadID = d.roadID;
        if (d.section) o.section = d.section;
        // ⚠️ 区間の設定はアプリでも同じ区間に効かせる（WebRouteStore.parse が読む）。決めていなければ入れない
        var leg = d.legSetting || {};
        if (leg.avoidTolls != null || leg.avoidHighways != null) {
          o.legSetting = { avoidTolls: leg.avoidTolls != null ? leg.avoidTolls : null,
                           avoidHighways: leg.avoidHighways != null ? leg.avoidHighways : null };
        }
        return o;
      }),
      conditions: { displacement: cond.displacement, avoidTolls: cond.avoidTolls, avoidHighways: cond.avoidHighways,
                    avoidFerries: cond.avoidFerries, etc: cond.etc,
                    rideAt: cond.rideAt ? cond.rideAt.toISOString() : null, isHoliday: cond.isHoliday },
      chosen: { distanceMeters: c.totalDistanceMeters, durationSeconds: c.totalDurationSeconds, index: chosen },
    };
    // ⚠️ **選んだ道そのものを渡す**（利用者の報告 2026-10-09: アプリに送ると新しく作り直されていた）。
    //    アプリは引き直さずにこの道を出す。大きすぎて渡せないときだけ、アプリが同じ条件で引き直す
    var routeText = RM.routeForApp(c);
    if (routeText) doc.route = routeText;
    el("send").disabled = true;
    try {
      await fb.db.collection("web_routes").doc(fb.user.uid).collection("routes").add(doc);
      setMsg(routeText
        ? "アプリに送りました。アプリの目的地検索の「Webで作ったルート」から、この道のまま開けます。"
        : "アプリに送りました（道が長すぎて線は送れなかったため、アプリが同じ条件で作り直します）。", "ok");
    } catch (e) {
      setMsg("送れませんでした: " + e.message, "err");
    } finally {
      el("send").disabled = false;
    }
  }
</script>
</body>
</html>
